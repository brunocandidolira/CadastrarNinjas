<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listar Ninjas</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        thead {
            background: #2c3e50;
            color: #fff;
        }

        thead th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        tbody tr {
            border-bottom: 1px solid #ddd;
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        tbody td {
            padding: 12px 15px;
            font-size: 0.95rem;
            vertical-align: middle;
        }

        td img {
            border-radius: 8px;
            border: 2px solid #ccc;
            object-fit: cover;
        }

        td a {
            display: inline-block;
            padding: 6px 12px;
            margin: 3px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }

        td a:first-child { background: #3498db; color: white; }
        td a:first-child:hover { background: #2980b9; }
        td a:nth-child(2) { background: #f1c40f; color: #fff; }
        td a:nth-child(2):hover { background: #d4ac0d; }
        td a:last-child { background: #e74c3c; color: white; }
        td a:last-child:hover { background: #c0392b; }

        /* Responsividade */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tbody tr { margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; background: #fff; }
            tbody td { display: flex; justify-content: space-between; padding: 10px; }
            tbody td::before { content: attr(data-label); font-weight: 600; text-transform: uppercase; color: #2c3e50; }
            .td-voltar { display: flex; justify-content: center; align-items: center; padding: 20px; }
            .btn.btn-secondary {
                background: #bdc3c7;
                color: #2c3e50;
                padding: 12px 24px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: bold;
                transition: 0.3s;
                text-align: center;
                min-width: 120px;
                max-width: 90%;
            }
            .btn.btn-secondary:hover { background: #95a5a6; }
        }
    </style>
</head>
<body>
<h1>Listar Ninjas</h1>
<table>
    <thead>
    <tr>
        <th>Imagem</th>
        <th>Id</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Idade</th>
        <th>Rank</th>
        <th>Missões</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ninja : ${ninjas}">
        <td data-label="Imagem"><img th:src="${ninja.imgUrl}" width="100" height="100"></td>
        <td data-label="Id" th:text="${ninja.id}"></td>
        <td data-label="Nome" th:text="${ninja.nome}"></td>
        <td data-label="Email" th:text="${ninja.email}"></td>
        <td data-label="Idade" th:text="${ninja.idade}"></td>
        <td data-label="Rank" th:text="${ninja.rank}"></td>
        <td data-label="Missões">
            <div th:if="${#lists.isEmpty(ninja.missoes)}">Sem missão cadastrada</div>
            <ul th:if="${!#lists.isEmpty(ninja.missoes)}">
                <li th:each="missao : ${ninja.missoes}">
                    <span th:text="${missao.nomeMissao}"></span> -
                    Dificuldade: <span th:text="${missao.dificuldade}"></span>
                </li>
            </ul>
        </td>
        <td data-label="Ações">
            <a th:href="@{/ninjas/ui/detalhes/{id}(id=${ninja.id})}">Ver detalhes</a>
            <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}">Deletar</a>
            <a th:href="@{/ninjas/ui/alterar/{id}(id=${ninja.id})}">Alterar</a>
        </td>
    </tr>
    <tr>
        <td colspan="8" class="td-voltar">
            <a href="/ninjas/ui/home" class="btn btn-secondary">Voltar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
