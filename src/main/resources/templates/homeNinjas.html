<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Home - Dashboard Ninja</title>
    <style>
        /* ================================
           RESET E CONFIGURAÇÕES GLOBAIS
        ================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: url('images/banner-ninja.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.6);
            z-index: 0;
        }

        /* ================================
           CONTAINER PRINCIPAL
        ================================ */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            text-align: center;
            color: #fff;
        }

        /* ================================
           TITULO E SUBTITULO
        ================================ */
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 40px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        }

        /* ================================
           GRID DE CARDS
        ================================ */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ================================
           HOVER NOS CARDS
        ================================ */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        /* ================================
           ICONES
        ================================ */
        .card img {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        /* ================================
           TEXTO DOS CARDS
        ================================ */
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 1rem;
            color: #555;
        }

        /* ================================
           RESPONSIVIDADE
        ================================ */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1.1rem; }
            .cards { gap: 15px; }
            .card { padding: 25px 15px; }
            .card img { width: 60px; height: 60px; }
        }
    </style>
</head>
