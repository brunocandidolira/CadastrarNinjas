<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Missões</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #f1f1f1;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(0,0,0,0.65);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 25px;
        }
        .mensagem {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            color: #7CFC00;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
        }
        th {
            background: rgba(255,255,255,0.1);
            color: #ffd700;
        }
        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }
        tr:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.01);
            transition: all 0.2s ease-in-out;
        }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: background 0.3s, transform 0.2s;
        }
        .btn-detalhes { background: #1e90ff; }
        .btn-detalhes:hover { background: #187bcd; transform: scale(1.05); }
        .btn-editar { background: #ffa500; }
        .btn-editar:hover { background: #e07b00; transform: scale(1.05); }
        .btn-excluir { background: #ff4500; }
        .btn-excluir:hover { background: #e03a00; transform: scale(1.05); }

.btn.btn-secondary {
  background: #bdc3c7;
  color: #2c3e50;
  padding: 12px 24px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
  text-align: center;
  min-width: 120px;           /* Tamanho mínimo */
  max-width: 90%;             /* Nunca ultrapassa a tela */
}

.btn.btn-secondary:hover {
  background: #95a5a6;
}

    </style>
</head>
<body>
<div class="container">
    <h1>Lista de Missões</h1>

    <div th:if="${mensagem}" class="mensagem">
        <p th:text="${mensagem}"></p>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome da Missão</th>
            <th>Dificuldade</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="missao : ${missoes}">
            <td th:text="${missao.id}"></td>
            <td th:text="${missao.nomeMissao}"></td>
            <td th:text="${missao.dificuldade}"></td>

            <td>
                <a th:href="@{/missoes/ui/detalhes/{id}(id=${missao.id})}" class="btn btn-detalhes">Detalhes</a>
                <a th:href="@{/missoes/ui/editar/{id}(id=${missao.id})}" class="btn btn-editar">Editar</a>
                <a th:href="@{/missoes/ui/deletar/{id}(id=${missao.id})}" class="btn btn-excluir"
                   onclick="return confirm('Tem certeza que deseja excluir esta missão?');">Excluir</a>
            </td>
        <tr>
            <td colspan="7" class="td-voltar"> <!-- colspan para ocupar todas as colunas -->
                <a href="/ninjas/ui/home" class="btn btn-secondary">Voltar</a>
            </td>
        </tr>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
